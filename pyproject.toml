[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-conflict-graph"
version = "1.0.0-alpha.1"
description = "NEXUS — Conflict Intelligence Graph Platform. Scaffolds conflict analysis apps with Neo4j, FastAPI, and AI agents. Part of the TACITUS suite."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Giulio Catanzariti", email = "gc@tacitus.me" },
    { name = "William Lyon" },
]
keywords = ["neo4j", "conflict-graph", "conflict-intelligence", "ai-agent", "scaffolding", "cli", "tacitus", "nexus", "dispute-resolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "neo4j>=5.20",
]

[project.optional-dependencies]
generate = [
    "anthropic>=0.30",
    "openai>=1.0",
]
ingest = [
    "neo4j-agent-memory[spacy,gliner]>=0.0.5",
]
connectors = [
    "PyGithub>=2.0",
    "notion-client>=2.0",
    "atlassian-python-api>=3.40",
    "slack-sdk>=3.20",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "simple-salesforce>=1.12",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]
all = [
    "nexus-conflict-graph[generate,ingest,connectors]",
]

[project.scripts]
nexus-conflict-graph = "nexus_conflict_graph.cli:main"

[project.urls]
Homepage = "https://tacitus.me/nexus"
Repository = "https://github.com/sargonxg/cc-graph-TACITUS-upgrade"
Documentation = "https://nexus.tacitus.me"
"Bug Tracker" = "https://github.com/sargonxg/cc-graph-TACITUS-upgrade/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_conflict_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (run with --slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
